name: macOS build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          swift --version
          cmake --version
      - name: Run offline checks
        run: bash scripts/check.sh
      - name: Build and verify signed app
        run: bash scripts/build-app.sh
      - name: Build and verify disk image
        run: bash scripts/build-dmg.sh --skip-build
      - name: Verify source packaging
        run: bash scripts/package-source.sh
      - name: Ensure builds leave source unchanged
        run: git diff --exit-code
      - name: Upload verified disk image
        uses: actions/upload-artifact@v7
        with:
          name: Still-Music-${{ runner.arch }}
          path: |
            build/Still-Music-*.dmg
            build/Still-Music-*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

name: macOS build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          swift --version
          cmake --version
      - name: Run offline checks
        run: bash scripts/check.sh
      - name: Build and verify signed app
        run: bash scripts/build-app.sh
      - name: Verify source packaging
        run: bash scripts/package-source.sh
      - name: Ensure builds leave source unchanged
        run: git diff --exit-code
